name: PHP CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *" # Daily at midnight UTC

permissions:
  contents: read

jobs:
  test:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
          coverage: none
      - run: composer validate --no-check-publish
      - run: composer install --no-interaction --prefer-dist
      - name: Generate ignored PHPUnit suites and fixtures
        run: composer generate
      - name: Ensure generated models and client APIs are current
        shell: bash
        run: |
          git ls-files --error-unmatch src/Generated/Client/RpcMethods.php >/dev/null
          if ! git ls-files 'src/Generated/Models/*.php' | grep -q .; then
            echo 'Generated model PHP files must be committed so CI tests the main-branch models.' >&2
            exit 1
          fi
          git diff --exit-code -- src/Generated/Models src/Generated/Client
      - name: Syntax check
        run: find src tests bin -type f \( -name '*.php' -o -name 'near-rpc-generate' \) -print0 | xargs -0 -n1 php -l
      - run: composer test

  publish:
    name: Publish release to GitHub and Packagist
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches Composer package version format
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '$GITHUB_REF_NAME' must be vX.Y.Z (optionally with a prerelease suffix)." >&2
            exit 1
          fi
      - name: Verify Packagist credentials are configured
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_API_TOKEN: ${{ secrets.PACKAGIST_API_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$PACKAGIST_USERNAME" || -z "$PACKAGIST_API_TOKEN" ]]; then
            echo "Set PACKAGIST_USERNAME and PACKAGIST_API_TOKEN in the repository Actions secrets." >&2
            exit 1
          fi
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
      - name: Update Packagist
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_API_TOKEN: ${{ secrets.PACKAGIST_API_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          response=$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Content-Type: application/json' \
            --header "Authorization: Bearer ${PACKAGIST_USERNAME}:${PACKAGIST_API_TOKEN}" \
            --data "{\"repository\":\"https://github.com/${GITHUB_REPOSITORY}\"}" \
            https://packagist.org/api/update-package)
          echo "$response"
          echo "$response" | jq --exit-status '.status == "success"' > /dev/null
