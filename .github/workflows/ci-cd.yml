name: PHP CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *" # Daily at midnight UTC

permissions:
  contents: read

jobs:
  test:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
          coverage: none
      - run: composer validate --no-check-publish
      - run: composer install --no-interaction --prefer-dist
      - name: Generate ignored PHPUnit suites and fixtures
        run: php bin/near-rpc-generate --seed=807541509
      - name: Syntax check
        run: find src tests bin -type f \( -name '*.php' -o -name 'near-rpc-generate' \) -print0 | xargs -0 -n1 php -l
      - run: composer test

  update-generated-pr:
    name: Create or update generated-code pull request
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: Regenerate models, API methods, and JSON fixtures
        run: php bin/near-rpc-generate --seed=807541509
      - name: Validate regenerated source before proposing it
        run: find src/Generated/Models src/Generated/Client -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Test regenerated models and client methods
        run: composer test
      - name: Stage generated outputs and report differences
        id: generated-diff
        shell: bash
        run: |
          # Keep generated fixtures local to CI. Tests have passed, so remove previously committed fixtures.
          if [[ -n "$(git ls-files -- tests/resources/models)" ]]; then
            git rm -r --ignore-unmatch -- tests/resources/models
          fi

          # Force-add generated source so missing/ignored output is detected even on first generation.
          git add -f -A -- src/Generated/Models src/Generated/Client
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Generated models and client methods are up to date.'
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            git diff --cached --stat
          fi
      - name: Create or update generated-code pull request
        id: create-pr
        if: steps.generated-diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: automation/generated-near-openapi
          base: main
          delete-branch: true
          commit-message: 'chore: regenerate NEAR JSON-RPC models and client'
          title: 'chore: update generated NEAR JSON-RPC API'
          body: |
            This pull request was generated by the scheduled OpenAPI workflow.

            It updates generated models and client methods from the current NEAR OpenAPI document.
            The generated PHP source passed syntax checks and the PHPUnit suite before this pull request was opened.
      - name: Merge the tested generated-code pull request
        if: steps.create-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        shell: bash
        run: gh pr merge "$PR_NUMBER" --squash --delete-branch
      - name: Record the merged commit for release
        id: merged-pr
        if: steps.create-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        shell: bash
        run: |
          pr_state=$(gh pr view "$PR_NUMBER" --json state,mergeCommit --jq '[.state, .mergeCommit.oid] | @tsv')
          read -r state merge_sha <<< "$pr_state"
          if [[ "$state" != 'MERGED' || -z "$merge_sha" ]]; then
            echo 'The generated-code pull request was not merged; refusing to publish.' >&2
            exit 1
          fi
          echo "sha=$merge_sha" >> "$GITHUB_OUTPUT"
      - name: Verify Packagist credentials are configured
        if: steps.merged-pr.outputs.sha != ''
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_API_TOKEN: ${{ secrets.PACKAGIST_API_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$PACKAGIST_USERNAME" || -z "$PACKAGIST_API_TOKEN" ]]; then
            echo 'Set PACKAGIST_USERNAME and PACKAGIST_API_TOKEN in the repository Actions secrets.' >&2
            exit 1
          fi
          echo 'PACKAGIST_API_TOKEN must be the main API token until the package is registered on Packagist.'
      - name: Calculate the next patch version for this generated merge
        id: generated-version
        if: steps.merged-pr.outputs.sha != ''
        env:
          RELEASE_SHA: ${{ steps.merged-pr.outputs.sha }}
        shell: bash
        run: |
          latest_tag=$(git tag --list 'v[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [[ -z "$latest_tag" ]]; then
            next_tag='v0.1.0'
          elif [[ "$(git rev-list -n 1 "$latest_tag")" == "$RELEASE_SHA" ]]; then
            next_tag="$latest_tag"
          else
            IFS=. read -r major minor patch <<< "${latest_tag#v}"
            next_tag="v${major}.${minor}.$((patch + 1))"
          fi
          echo "tag=$next_tag" >> "$GITHUB_OUTPUT"
      - name: Tag the generated merge
        id: tag-release
        if: steps.merged-pr.outputs.sha != ''
        env:
          RELEASE_TAG: ${{ steps.generated-version.outputs.tag }}
          RELEASE_SHA: ${{ steps.merged-pr.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          resolve_tag_commit() {
            local tag_name="$1" ref_data object_sha object_type
            ref_data=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag_name}" --jq '[.object.sha, .object.type] | @tsv' 2>/dev/null) || return 1
            IFS=$'\t' read -r object_sha object_type <<< "$ref_data"
            while [[ "$object_type" == 'tag' ]]; do
              ref_data=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}" --jq '[.object.sha, .object.type] | @tsv')
              IFS=$'\t' read -r object_sha object_type <<< "$ref_data"
            done
            [[ "$object_type" == 'commit' ]] || return 1
            printf '%s' "$object_sha"
          }

          release_tag="$RELEASE_TAG"
          for attempt in $(seq 1 100); do
            if remote_sha=$(resolve_tag_commit "$release_tag"); then
              if [[ "$remote_sha" == "$RELEASE_SHA" ]]; then
                echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "Release tag $release_tag points to $remote_sha, not $RELEASE_SHA; trying the next patch version."
            else
              if gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
                -f ref="refs/tags/${release_tag}" \
                -f sha="$RELEASE_SHA" \
                --jq '.ref'; then
                echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              # Another run may have created this ref between the lookup and POST.
              if remote_sha=$(resolve_tag_commit "$release_tag") && [[ "$remote_sha" == "$RELEASE_SHA" ]]; then
                echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "Could not create release tag $release_tag; trying the next patch version."
            fi
            IFS=. read -r major minor patch <<< "${release_tag#v}"
            release_tag="v${major}.${minor}.$((patch + 1))"
          done
          echo 'Could not allocate an unused release tag after 100 attempts.' >&2
          exit 1
      - name: Create GitHub release for the generated merge
        if: steps.merged-pr.outputs.sha != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag-release.outputs.tag }}
          generate_release_notes: true
      - name: Create Packagist package if it has not been registered yet
        if: steps.merged-pr.outputs.sha != ''
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_API_TOKEN: ${{ secrets.PACKAGIST_API_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          package_name=$(php -r '$composer = json_decode(file_get_contents("composer.json"), true, 512, JSON_THROW_ON_ERROR); echo $composer["name"];')
          package_url="https://packagist.org/packages/${package_name}.json"
          http_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$package_url")

          if [[ "$http_status" == '200' ]]; then
            echo "Packagist package ${package_name} is already registered."
          elif [[ "$http_status" == '404' ]]; then
            echo "Packagist package ${package_name} is not registered; creating it."
            response=$(curl --fail-with-body --silent --show-error \
              --request POST \
              --header 'Content-Type: application/json' \
              --header "Authorization: Bearer ${PACKAGIST_USERNAME}:${PACKAGIST_API_TOKEN}" \
              --data "{\"repository\":\"https://github.com/${GITHUB_REPOSITORY}\"}" \
              https://packagist.org/api/create-package)
            echo "$response"
            echo "$response" | jq --exit-status '.status == "success"' > /dev/null
          else
            echo "Packagist package lookup returned HTTP ${http_status}; refusing to continue." >&2
            exit 1
          fi
      - name: Update Packagist after the generated merge
        if: steps.merged-pr.outputs.sha != ''
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_API_TOKEN: ${{ secrets.PACKAGIST_API_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          response=$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Content-Type: application/json' \
            --header "Authorization: Bearer ${PACKAGIST_USERNAME}:${PACKAGIST_API_TOKEN}" \
            --data "{\"repository\":\"https://github.com/${GITHUB_REPOSITORY}\"}" \
            https://packagist.org/api/update-package)
          echo "$response"
          echo "$response" | jq --exit-status '.status == "success"' > /dev/null
