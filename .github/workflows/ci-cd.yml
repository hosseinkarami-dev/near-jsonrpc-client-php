name: PHP CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *" # Daily at midnight UTC

permissions:
  contents: read

jobs:
  test:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
          coverage: none
      - run: composer validate --no-check-publish
      - run: composer install --no-interaction --prefer-dist
      - name: Generate ignored PHPUnit suites and fixtures
        run: php bin/near-rpc-generate --seed=807541509
      - name: Check generated source diff
        if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          git add --intent-to-add src/Generated/Models src/Generated/Client tests/resources/models
          git diff --exit-code -- src/Generated/Models src/Generated/Client
      - name: Syntax check
        run: find src tests bin -type f \( -name '*.php' -o -name 'near-rpc-generate' \) -print0 | xargs -0 -n1 php -l
      - run: composer test

  update-generated-pr:
    name: Create or update generated-code pull request
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: Regenerate models, API methods, and JSON fixtures
        run: php bin/near-rpc-generate --seed=807541509
      - name: Stage generated outputs and report differences
        id: generated-diff
        shell: bash
        run: |
          git add -A -- src/Generated/Models src/Generated/Client tests/resources/models
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Generated models, client methods, and fixtures are up to date.'
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            git diff --cached --stat
          fi
      - name: Require a token that can create PRs and trigger their CI
        if: steps.generated-diff.outputs.changed == 'true'
        env:
          OPENAPI_UPDATE_TOKEN: ${{ secrets.OPENAPI_UPDATE_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$OPENAPI_UPDATE_TOKEN" ]]; then
            echo 'Set OPENAPI_UPDATE_TOKEN to a repository-scoped token with Contents and Pull requests read/write access.' >&2
            exit 1
          fi
      - name: Create or update generated-code pull request
        id: create-pr
        if: steps.generated-diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.OPENAPI_UPDATE_TOKEN }}
          branch: automation/generated-near-openapi
          delete-branch: true
          commit-message: 'chore: regenerate NEAR JSON-RPC models and client'
          title: 'chore: update generated NEAR JSON-RPC API'
          body: |
            This pull request was generated by the scheduled OpenAPI workflow.

            It updates generated models, client methods, and schema fixtures from the current NEAR OpenAPI document.
            The workflow runs the generated PHPUnit suites before opening this pull request.
      - name: Enable auto-merge after pull-request checks pass
        if: steps.create-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.OPENAPI_UPDATE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        shell: bash
        run: gh pr merge "$PR_NUMBER" --auto --squash --delete-branch

  publish:
    name: Publish release to GitHub and Packagist
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches Composer package version format
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '$GITHUB_REF_NAME' must be vX.Y.Z (optionally with a prerelease suffix)." >&2
            exit 1
          fi
      - name: Verify Packagist credentials are configured
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_API_TOKEN: ${{ secrets.PACKAGIST_API_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$PACKAGIST_USERNAME" || -z "$PACKAGIST_API_TOKEN" ]]; then
            echo "Set PACKAGIST_USERNAME and PACKAGIST_API_TOKEN in the repository Actions secrets." >&2
            exit 1
          fi
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
      - name: Update Packagist
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_API_TOKEN: ${{ secrets.PACKAGIST_API_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          response=$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Content-Type: application/json' \
            --header "Authorization: Bearer ${PACKAGIST_USERNAME}:${PACKAGIST_API_TOKEN}" \
            --data "{\"repository\":\"https://github.com/${GITHUB_REPOSITORY}\"}" \
            https://packagist.org/api/update-package)
          echo "$response"
          echo "$response" | jq --exit-status '.status == "success"' > /dev/null
