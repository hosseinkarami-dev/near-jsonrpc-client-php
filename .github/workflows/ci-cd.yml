name: PHP CI/CD

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *" # Daily at midnight UTC

permissions:
  contents: read

jobs:
  test:
    name: Tests (PHP ${{ matrix.php }})
    if: github.event_name != 'pull_request' || github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
          coverage: none
      - run: composer validate --no-check-publish
      - run: composer install --no-interaction --prefer-dist
      - name: Generate ignored PHPUnit suites and fixtures
        run: php bin/near-rpc-generate --seed=807541509
      - name: Check generated source diff
        if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          git add --intent-to-add src/Generated/Models src/Generated/Client tests/resources/models
          git diff --exit-code -- src/Generated/Models src/Generated/Client
      - name: Syntax check
        run: find src tests bin -type f \( -name '*.php' -o -name 'near-rpc-generate' \) -print0 | xargs -0 -n1 php -l
      - run: composer test

  update-generated-pr:
    name: Create or update generated-code pull request
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: Regenerate models, API methods, and JSON fixtures
        run: php bin/near-rpc-generate --seed=807541509
      - name: Stage generated outputs and report differences
        id: generated-diff
        shell: bash
        run: |
          git add -A -- src/Generated/Models src/Generated/Client tests/resources/models
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Generated models, client methods, and fixtures are up to date.'
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            git diff --cached --stat
          fi
      - name: Create or update generated-code pull request
        id: create-pr
        if: steps.generated-diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: automation/generated-near-openapi
          delete-branch: true
          commit-message: 'chore: regenerate NEAR JSON-RPC models and client'
          title: 'chore: update generated NEAR JSON-RPC API'
          body: |
            This pull request was generated by the scheduled OpenAPI workflow.

            It updates generated models, client methods, and schema fixtures from the current NEAR OpenAPI document.
            The generated PHPUnit suites passed before this pull request was opened.

  detect-generated-diff:
    name: Detect generated API changes in merged PR
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the merged pull request's actual file diff
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          changed_paths=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '.[].filename')
          generated_paths=$(printf '%s\n' "$changed_paths" | grep -E '^(src/Generated/Models/|src/Generated/Client/)' || true)
          if [[ -z "$generated_paths" ]]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'The merged pull request contains no generated model or client API changes.'
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo 'Generated model or client API changes detected in the merged pull request:'
            printf '%s\n' "$generated_paths"
          fi

  publish:
    name: Publish release to GitHub and Packagist
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' && needs.detect-generated-diff.outputs.changed == 'true'
    needs: [test, detect-generated-diff]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: Verify Packagist credentials are configured
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_API_TOKEN: ${{ secrets.PACKAGIST_API_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$PACKAGIST_USERNAME" || -z "$PACKAGIST_API_TOKEN" ]]; then
            echo 'Set PACKAGIST_USERNAME and PACKAGIST_API_TOKEN in the repository Actions secrets.' >&2
            exit 1
          fi
      - name: Calculate next patch version
        id: version
        env:
          RELEASE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        shell: bash
        run: |
          latest_tag=$(git tag --list 'v[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [[ -z "$latest_tag" ]]; then
            next_tag='v0.1.0'
          elif [[ "$(git rev-list -n 1 "$latest_tag")" == "$RELEASE_SHA" ]]; then
            next_tag="$latest_tag"
          else
            IFS=. read -r major minor patch <<< "${latest_tag#v}"
            next_tag="v${major}.${minor}.$((patch + 1))"
          fi
          echo "tag=$next_tag" >> "$GITHUB_OUTPUT"
          echo "Release version: $next_tag"
      - name: Create and push release tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        shell: bash
        run: |
          if git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            if [[ "$(git rev-list -n 1 "$RELEASE_TAG")" != "$RELEASE_SHA" ]]; then
              echo "Release tag $RELEASE_TAG already points to a different commit." >&2
              exit 1
            fi
          else
            git tag "$RELEASE_TAG" "$RELEASE_SHA"
          fi
          git push origin "$RELEASE_TAG"
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
      - name: Update Packagist
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_API_TOKEN: ${{ secrets.PACKAGIST_API_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          response=$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Content-Type: application/json' \
            --header "Authorization: Bearer ${PACKAGIST_USERNAME}:${PACKAGIST_API_TOKEN}" \
            --data "{\"repository\":\"https://github.com/${GITHUB_REPOSITORY}\"}" \
            https://packagist.org/api/update-package)
          echo "$response"
          echo "$response" | jq --exit-status '.status == "success"' > /dev/null
