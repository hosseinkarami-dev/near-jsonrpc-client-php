name: PHP CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *" # Daily at midnight UTC

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate-test-merge-release:
    name: Regenerate, test, merge, and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Generate models, API methods, and tests
        run: php bin/near-rpc-generate --seed=807541509

      - name: Validate generated PHP syntax
        run: find src/Generated/Models src/Generated/Client -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run test suite
        run: composer test

      - name: Prepare generated-code branch
        id: generated
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="automation/generated-near-openapi-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git add -f -A -- src/Generated/Models src/Generated/Client

          if git diff --cached --quiet -- src/Generated/Models src/Generated/Client; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Generated models and API methods are already up to date.'
            exit 0
          fi

          git diff --cached --stat -- src/Generated/Models src/Generated/Client
          git commit -m "chore: regenerate NEAR JSON-RPC models and API methods"
          git push origin "$branch"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Create and merge generated-code pull request
        id: merge
        if: steps.generated.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const branch = '${{ steps.generated.outputs.branch }}';
            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'chore: regenerate NEAR JSON-RPC models and API methods',
              head: branch,
              base: 'main',
              body: 'Generated model and API method updates passed the generated-code tests in the workflow.'
            });
            core.info('Created PR #' + pr.data.number + '; merging it now.');
            const merged = await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.data.number,
              merge_method: 'squash'
            });
            let mergeSha = merged.data.sha;
            if (!mergeSha) {
              const details = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.data.number
              });
              mergeSha = details.data.merge_commit_sha;
            }
            if (!mergeSha) throw new Error('Could not determine the generated-code merge commit.');
            core.setOutput('sha', mergeSha);
            core.setOutput('number', String(pr.data.number));

      - name: Create release tag
        id: tag
        if: steps.generated.outputs.changed == 'true'
        env:
          RELEASE_SHA: ${{ steps.merge.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          latest_tag=$(git ls-remote --tags --refs origin 'refs/tags/v*' | awk '{print $2}' | sed 's#refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [[ -z "$latest_tag" ]]; then
            candidate='v0.1.0'
          else
            IFS=. read -r major minor patch <<< "${latest_tag#v}"
            candidate="v${major}.${minor}.$((patch + 1))"
          fi

          for attempt in $(seq 1 100); do
            if gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$candidate" \
              -f sha="$RELEASE_SHA" \
              --jq '.ref' >/dev/null 2>&1; then
              echo "tag=$candidate" >> "$GITHUB_OUTPUT"
              echo "Created $candidate at $RELEASE_SHA"
              exit 0
            fi
            IFS=. read -r major minor patch <<< "${candidate#v}"
            candidate="v${major}.${minor}.$((patch + 1))"
          done
          echo 'Could not allocate an unused release tag after 100 attempts.' >&2
          exit 1

      - name: Create GitHub release
        if: steps.generated.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true

      - name: Update Packagist
        if: steps.generated.outputs.changed == 'true'
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_API_TOKEN: ${{ secrets.PACKAGIST_API_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$PACKAGIST_USERNAME" || -z "$PACKAGIST_API_TOKEN" ]]; then
            echo 'Set PACKAGIST_USERNAME and PACKAGIST_API_TOKEN in repository Actions secrets.' >&2
            exit 1
          fi
          response=$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Content-Type: application/json' \
            --header "Authorization: Bearer $PACKAGIST_USERNAME:$PACKAGIST_API_TOKEN" \
            --data "{\"repository\":\"https://github.com/$GITHUB_REPOSITORY\"}" \
            https://packagist.org/api/update-package)
          echo "$response"
          echo "$response" | jq --exit-status '.status == "success"' >/dev/null
